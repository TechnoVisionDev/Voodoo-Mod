name: build
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run gameplay tests
        run: ./gradlew build runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: voodoo-poppets-reborn-neoforge-26.1.2
          path: build/libs/
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build preserved Fabric edition
        run: ./gradlew -p fabric build
      - uses: actions/upload-artifact@v4
        with:
          name: voodoo-poppets-reborn-fabric-26.2
          path: fabric/build/libs/
